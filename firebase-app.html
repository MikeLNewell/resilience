<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Household Resilience | Secure planner</title><style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');

:root {
  color-scheme: light;
  --canvas: #f4f1ea;
  --surface: #fcfaf5;
  --ink: #201e18;
  --muted: #625c50;
  --accent: #a8311d;
  --accent-hover: #822514;
  --line: #d8d0c2;
  --control: #82776a;
  --soft: #ece6da;
  --success: #28593f;
  --error: #942d20;
  --display: 'Instrument Serif', Georgia, serif;
  --body: Inter, system-ui, sans-serif;
  --radius: 4px;
  --gap: clamp(16px, 3vw, 32px);
  font: 400 16px/1.55 var(--body);
  color: var(--ink);
  background: var(--canvas);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
main, .header-inner { max-width: 1240px; margin-inline: auto; padding-inline: var(--gap); }
main { padding-block: clamp(24px, 5vw, 56px); }
header { border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 76px; }
.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.035em; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: white; background: var(--accent); font: 26px/1 var(--display); border-radius: var(--radius); }
h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; }
h1 { font-size: clamp(44px, 7vw, 76px); line-height: .98; letter-spacing: -.025em; }
h2 { font-size: clamp(29px, 4vw, 40px); line-height: 1.05; }
.muted, small { color: var(--muted); }
small { font-size: .86rem; }
button, input, select { min-height: 44px; max-width: 100%; border: 1px solid var(--control); border-radius: var(--radius); font: inherit; }
button { background: var(--accent); color: #fff; border-color: transparent; font-weight: 650; padding: 9px 16px; cursor: pointer; transition: background-color 140ms ease; }
button:hover { background: var(--accent-hover); }
button.secondary { color: var(--ink); background: transparent; border-color: var(--control); }
button.secondary:hover { background: var(--soft); }
button:disabled { opacity: .65; cursor: wait; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
input, select { background: var(--surface); color: var(--ink); padding: 8px 10px; width: 100%; }
label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
.row > label { flex: 1 1 155px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--gap); }
.auth-layout { display: grid; grid-template-columns: 1.15fr 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-height: 460px; }
.auth-intro { background: #e9e1d3; padding: clamp(24px, 6vw, 72px); display: grid; align-content: center; gap: 20px; }
.auth-intro p { max-width: 35ch; }
.auth-panel { background: var(--surface); padding: clamp(24px, 5vw, 56px); display: grid; align-content: center; gap: 24px; }
.auth-panel form { display: grid; gap: 16px; }
.workspace { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: var(--gap); }
.filters { margin-bottom: 18px; }
.stock-summary { margin-bottom: 10px; }
.purchase-date { display: block; }
nav { display: grid; align-content: start; gap: 5px; }
nav button { color: var(--muted); background: transparent; border: 1px solid transparent; text-align: left; }
nav button:hover { color: var(--ink); background: var(--soft); }
nav [aria-current="page"] { color: var(--accent); background: var(--surface); border-color: var(--line); }
.workspace-body { min-width: 0; display: grid; gap: var(--gap); align-content: start; }
#content { display: grid; gap: var(--gap); }
.page-heading { display: grid; gap: 10px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
.metric { min-width: 0; padding: clamp(14px, 2.5vw, 24px); display: grid; align-content: start; gap: 6px; }
.metric + .metric { border-left: 1px solid var(--line); }
.value { font: clamp(34px, 4.6vw, 54px)/1 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.progress { display: block; width: 100%; height: 7px; accent-color: var(--accent); }
.priority { border-top: 3px solid var(--accent); }
.priority h2, .card > h2 { margin-bottom: 16px; }
.item { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(95px, .75fr) auto; align-items: center; gap: 16px; padding: 15px 0; border-top: 1px solid var(--line); }
.item:last-child { padding-bottom: 0; }
.item-name { display: grid; gap: 3px; }
.item-stock { display: grid; gap: 6px; }
.item-stock strong, .money { font-variant-numeric: tabular-nums; }
.purchase { grid-template-columns: minmax(0, 1fr) auto; }
#recordForm { border-top: 3px solid var(--accent); display: grid; gap: 14px; }
#recordForm h2 { margin: 0; }
#message { margin-bottom: 16px; padding: 10px 14px; background: var(--soft); border-left: 3px solid var(--muted); overflow-wrap: anywhere; }
#message:empty { display: none; }
#message[data-tone="success"] { color: var(--success); border-color: var(--success); }
#message[data-tone="error"] { color: var(--error); border-color: var(--error); }
.hidden, #recordForm.hidden { display: none; }
@media (max-width: 780px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  nav { display: flex; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  nav button { text-align: center; flex: 1 1 auto; padding-inline: 8px; }
}
@media (max-width: 570px) {
  .auth-layout { grid-template-columns: minmax(0, 1fr); }
  .auth-intro { gap: 12px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .metric + .metric { border-left: 0; border-top: 1px solid var(--line); }
  .item:not(.purchase) { grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; }
  .item-name { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--control);background:var(--surface);color:var(--ink)}.month-line{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.check-label{display:flex;align-items:center;gap:8px}.check-label input{width:20px;min-height:20px}#profileForm,#completeMonthForm{display:grid;gap:16px}.print-only{display:none}@media(max-width:570px){.month-line{grid-template-columns:1fr 1fr}.month-line .check-label{grid-column:1/-1}}@media print{header,nav,#message,#recordForm,.no-print,.page-heading,#auth{display:none!important}.print-only{display:block}main,.workspace,.workspace-body,#content{display:block;padding:0;margin:0;max-width:none}.printable-month{border:0;background:white;color:black}body{background:white;color:black}}.price-links{line-height:2.2}.price-links a{display:inline-block;margin-right:9px}.price-table{width:100%;border-collapse:collapse}.price-table th,.price-table td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.price-table th{font-weight:600}.price-table td:last-child,.price-table th:last-child{text-align:right}@media(max-width:570px){.price-table{font-size:.82rem}}.item-actions{justify-content:flex-end;align-items:center}.item-actions button{white-space:nowrap}.item.purchase{grid-template-columns:minmax(0,1fr) auto auto}#editForm{border-top:3px solid var(--accent)}#editForm:not(.hidden){display:grid;gap:16px}#editCostLabel.hidden{display:none}@media(max-width:570px){.item-actions{grid-column:1/-1;justify-content:flex-start}.item.purchase{grid-template-columns:minmax(0,1fr) auto}.item.purchase button{grid-column:1/-1;justify-self:start}}@media print{#editForm{display:none!important}}</style>
</head>
<body>
<header><div class="header-inner">
  <div class="brand"><span class="brand-mark" aria-hidden="true">H</span>Household Resilience</div>
  <button class="secondary hidden" id="logout">Sign out</button>
</div></header>
<main>
  <p id="message" role="status"></p>
  <section id="auth" class="auth-layout" aria-labelledby="auth-title">
    <div class="auth-intro">
      <h1 id="auth-title">Household<br>Resilience</h1>
      <p>Track the supplies you have and plan what to buy next.</p>
    </div>
    <div class="auth-panel">
      <h2>Sign in</h2>
      <form id="authForm">
        <label>Email<input type="email" id="email" autocomplete="email" required></label>
        <label>Password<input type="password" id="password" autocomplete="current-password" minlength="6" required></label>
        <div class="row"><button type="submit">Sign in</button><button type="button" class="secondary" id="register">Create account</button><button type="button" class="secondary" id="resetPassword">Reset password</button></div>
      </form>
    </div>
  </section>
  <section id="app" class="workspace hidden" aria-label="Household planner">
    <nav aria-label="Planner">
      <button type="button" data-tab="plan" aria-current="page">12-month plan</button>
      <button type="button" data-tab="dashboard">Overview</button>
      <button type="button" data-tab="inventory">Inventory</button>
      <button type="button" data-tab="shopping">Shopping list</button>
      <button type="button" data-tab="purchases">Purchases</button>
      <button type="button" data-tab="prices">Price finder</button>
      <button type="button" data-tab="wood">Wood &amp; Heating</button>
      <button type="button" data-tab="settings">Settings</button>
    </nav>
    <div class="workspace-body">
      <form id="recordForm" class="card hidden" aria-labelledby="recordTitle">
        <h2 id="recordTitle"></h2>
        <div class="row">
          <label>Quantity<input id="recordQuantity" type="number" min="1" step="1" required></label>
          <label>Total paid (£)<input id="recordCost" type="number" min="0" step="0.01" required></label>
        </div>
        <p class="muted">Enter £0 for stock you already own.</p>
        <div class="row"><button id="recordSave" type="submit">Save item</button><button id="recordCancel" type="button" class="secondary">Cancel</button></div>
      </form>
      <form id="editForm" class="card hidden" aria-labelledby="editTitle">
        <h2 id="editTitle"></h2><p id="editHelp" class="muted"></p>
        <div class="row"><label>Quantity<input id="editQuantity" type="number" min="0" max="1000000" step="1" required></label>
        <label id="editCostLabel">Total paid (£)<input id="editCost" type="number" min="0" max="100000" step=".01"></label></div>
        <div class="row"><button type="submit" id="editSave">Save changes</button><button type="button" id="editDelete" class="secondary">Delete</button><button type="button" id="editCancel" class="secondary">Cancel</button></div>
      </form><div id="content"></div>
    </div>
  </section>
</main>
<script type="module">
import {createPriceFinder} from './price-finder.js';
import {createWood} from './wood-heating.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {Timestamp,getFirestore,doc,collection,getDoc,setDoc,getDocs,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $ = id => document.getElementById(id);
function say(message, tone = '') {
  $('message').dataset.tone = tone;
  $('message').textContent = message;
}
let cfg;try{cfg=(await import('./firebase-config.js')).firebaseConfig;if(!cfg||cfg.apiKey==='REPLACE_ME')throw Error('Configuration not set');}catch(e){$('auth').innerHTML='<h1>Firebase setup required</h1><p>Configure firebase-config.js before using secure sign-in.</p>';throw e}
const auth=getAuth(initializeApp(cfg)),db=getFirestore(auth.app);
const catalogue=[['Water','Drinking water (litres)',3,210,.4],['Safety','Carbon monoxide alarm',0,1,25],['Safety','Smoke alarm',0,2,15],['Lighting','LED lantern',1,3,14],['Communications','Battery radio',1,1,28],['Power','Power bank',1,2,22],['Food','Tinned beans',2,20,.8],['Food','Rice (kg)',2,3,1.7],['Food','Pasta (kg)',2,4,1.5],['Food','UHT milk (litres)',2,16,1.2],['Cooking','Manual tin opener',1,1,8],['Medical','First aid kit',1,1,25],['Sanitation','Heavy-duty bin bags',1,2,6],['Warmth','Warm sleeping bags',2,5,25],
['Lighting','Torch',0,1,8],
['Lighting','Spare batteries (pack)',0,1,5],
['Hygiene','Hand sanitiser (bottle)',0,1,2],
['Hygiene','Wet wipes (pack)',0,2,1.5],
['Hygiene','Toilet paper (pack)',0,1,4],
['Food','Ready-to-eat tinned food (tin)',0,15,1.5],
['Food','Dried fruit (pack)',0,2,2]].map((v,id)=>({id,category:v[0],name:v[1],priority:v[2],target:v[3],price:v[4]}));
// Stable catalogue IDs are also Firestore inventory document IDs.
const coreTargets = {0:45, 14:1, 15:1, 6:10, 19:15, 20:2, 10:1, 16:1, 17:2, 18:1, 4:1, 5:1, 11:1};
const coreOrder = Object.keys(coreTargets).map(Number);
function priorityFor(item) {
  return coreTargets[item.id] ? 0 : item.id === 7 || item.id === 8 ? 2 : 1;
}
catalogue.forEach(item => { item.priority = priorityFor(item); });
let user=null,settings={},stock={},purchases=[],tab='plan';
function path(...parts){return doc(db,'households',user.uid,...parts)}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function owned(x){return stock[x.id]?.quantity||0}function target(x){if(x.id===0)return settings.days*profile.size*3;if(x.category==='Food')return Math.ceil(x.target*profile.size/5);return x.target}function need(x){return Math.max(0,target(x)-owned(x))}function money(n){return '£'+Number(n).toFixed(2)}
async function refresh() {
 const uid=user?.uid;if(!uid)return;
 const root=doc(db,'households',uid),h=await getDoc(root);
 if(!h.exists()){settings={monthlyBudget:50,months:12,days:14,rollover:true};await setDoc(root,{...settings,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}
 else settings=h.data();
 if(user?.uid!==uid)return;
 const [a,b]=await Promise.all([getDocs(collection(root,'inventory')),getDocs(collection(root,'purchases')),loadCalendar(uid).catch(err=>{if(err.code==='permission-denied'){say('Additional calendar permissions are not yet published in Firebase. Inventory remains available.','error');return;}throw err;})]);
 if(user?.uid!==uid)return;
 stock=Object.fromEntries(a.docs.map(d=>[d.id,d.data()]));purchases=b.docs.map(d=>({...d.data(),recordId:d.id}));render();
}
const filters = {search: '', category: '', status: ''};
const priceFinder=createPriceFinder({catalogue,getNeed:need,getUser:()=>user,safe,money});
const wood=createWood({db,getUser:()=>user,safe,money,say});
const categories = [...new Set(catalogue.map(item => item.category))].sort();
const purchaseDate = new Intl.DateTimeFormat('en-GB', {dateStyle: 'medium', timeZone: 'Europe/London'});

function monthlyPlan() {
  const basics = coreOrder.map(id => {
    const item = catalogue[id];
    return {...item, phase: 'Three-day essentials', remaining: Math.max(0, coreTarget(id) - owned(item))};
  });
  const extra = catalogue.map(item => ({
    ...item, phase: 'Additional supplies',
    remaining: Math.max(0, Math.ceil(need(item)) - Math.max(0, coreTarget(item.id) - owned(item)))
  })).sort((a, b) => a.priority - b.priority || a.price - b.price);
  const remaining = [...basics, ...extra];
  let balance = 0;
  return Array.from({length: settings.months}, (_, index) => {
    balance += Math.round(settings.monthlyBudget * 100);
    const lines = [];
    for (const item of remaining) {
      const price = Math.round(item.price * 100);
      const quantity = price > 0 ? Math.min(item.remaining, Math.floor(balance / price)) : item.remaining;
      if (!item.remaining) continue;
      if (!quantity) break;
      lines.push({...item, quantity, cost: quantity * price / 100});
      item.remaining -= quantity;
      balance -= quantity * price;
      if (item.remaining) break;
    }
    return {month: index + 1, lines, balance: balance / 100};
  });
}

function render(){let items=catalogue.filter(x=>need(x)>0).sort((a,b)=>a.priority-b.priority||a.id-b.id);let month=new Date().toISOString().slice(0,7);let spent=purchases.filter(p=>p.purchasedAt?.toDate?.().toISOString().slice(0,7)===month).reduce((s,p)=>s+p.cost,0);let left=Math.max(0,settings.monthlyBudget-spent);let total=items.reduce((s,x)=>s+need(x)*x.price,0);let next=items.find(x=>x.price<=left)||items[0];
const row = item => {
  const quantity = owned(item);
  const goal = target(item);
  return `<div class="item">
    <div class="item-name"><strong>${safe(item.name)}</strong><small>${safe(item.category)} · Priority ${item.priority + 1} · Est. ${money(item.price)} per unit</small></div>
    <div class="item-stock"><small><strong>${safe(quantity)}</strong> of ${safe(goal)} in stock</small>
      <progress class="progress" aria-label="${safe(item.name)} stock target" value="${Math.min(quantity, goal)}" max="${goal}"></progress>
    </div>
    <div class="row item-actions"><button type="button" class="secondary" data-price="${item.id}" aria-label="Find prices for ${safe(item.name)}">Prices</button><button type="button" data-add="${item.id}" aria-label="Record ${safe(item.name)}">Record</button>${quantity>0?'<button type="button" class="secondary" data-edit-stock="'+item.id+'">Edit stock</button>':''}</div>
  </div>`;
};
const titles = {plan: 'Your 12-month buying plan', dashboard: 'Household overview', inventory: 'Inventory', shopping: 'Shopping list', purchases: 'Purchases', prices: 'Price finder', wood: 'Wood & Heating', settings: 'Planning settings'};
let html = `<div class="page-heading"><h1>${tab === 'plan' ? `Your ${settings.months}-month buying plan` : titles[tab]}</h1></div>`;
if (tab === 'plan') {
  html += renderCalendar() + renderReview();
} else if (tab === 'dashboard') {
  const completed = catalogue.length - items.length;
  html += `<div class="grid">
    <div class="metric"><small>Stock targets met</small><div class="value">${completed} / ${catalogue.length}</div>
      <progress class="progress" aria-label="Stock targets met" value="${completed}" max="${catalogue.length}"></progress></div>
    <div class="metric"><small>Budget remaining this month</small><div class="value">${money(left)}</div></div>
    <div class="metric"><small>Estimated cost to reach targets</small><div class="value">${money(total)}</div></div>
  </div>
  <section class="card priority"><h2>Next priority</h2>${next ? row(next) : '<p>All stock targets reached.</p>'}</section>`;
} else if (tab === 'inventory') {
  html += `<section class="card" aria-label="Stock catalogue"><h2>Stock catalogue</h2>
    <div class="row filters">
      <label>Search supplies<input id="stockSearch" type="search" value="${safe(filters.search)}" placeholder="e.g. rice"></label>
      <label>Category<select id="stockCategory"><option value="">All categories</option>${categories.map(category =>
        `<option ${category === filters.category ? 'selected' : ''}>${safe(category)}</option>`
      ).join('')}</select></label>
      <label>Stock level<select id="stockStatus">
        <option value="">Any stock level</option>
        <option value="needed" ${filters.status === 'needed' ? 'selected' : ''}>Below target</option>
        <option value="empty" ${filters.status === 'empty' ? 'selected' : ''}>Out of stock</option>
        <option value="met" ${filters.status === 'met' ? 'selected' : ''}>Target met</option>
      </select></label>
      <button type="button" class="secondary" id="clearFilters">Clear filters</button>
    </div>
    <p id="stockSummary" class="muted stock-summary" role="status"></p>
    <div id="stockResults"></div>
  </section>`;
} else if (tab === 'shopping') {
  html += `<section class="card" aria-label="Supplies below target">
    <h2>Supplies below target</h2>
    <p class="muted stock-summary">${items.length ? `${money(total)} estimated to reach all targets` : 'All stock targets reached.'}</p>
    ${items.map(item => `<div class="item">
      <div class="item-name"><strong>${safe(item.name)}</strong><small>${safe(item.category)} · Priority ${item.priority + 1}</small></div>
      <div class="item-stock"><small><strong>${need(item)}</strong> to reach target</small>
        <small>${money(need(item) * item.price)} estimated</small></div>
      <button type="button" class="secondary" data-price="${item.id}" aria-label="Find prices for ${safe(item.name)}">Prices</button><button type="button" data-add="${item.id}" aria-label="Record ${safe(item.name)}">Record</button>
    </div>`).join('')}
  </section>`;
} else if (tab === 'wood') {
  html += wood.render();
} else if (tab === 'prices') {
  html += priceFinder.render();
} else if (tab === 'purchases') {
  const history = [...purchases].sort((a, b) =>
    (b.purchasedAt?.toMillis?.() ?? 0) - (a.purchasedAt?.toMillis?.() ?? 0));
  html += `<section class="card" aria-label="Purchase history"><h2>Purchase history</h2>
    <p class="stock-summary muted">Spent this month <strong>${money(spent)}</strong> of ${money(settings.monthlyBudget)}</p><p class="muted">Edit a purchase to correct its quantity or cost. Deleting a purchase reverses its recorded stock addition. To remove consumed stock without changing spending, use Inventory instead.</p>
    ${history.length ? history.map(p => {
      const date = p.purchasedAt?.toDate?.();
      return `<div class="item purchase"><span>${safe(p.name)} × ${safe(p.quantity)}
        ${date ? `<time class="purchase-date muted" datetime="${date.toISOString()}">${purchaseDate.format(date)}</time>` : ''}
        </span><strong class="money">${money(p.cost)}</strong><button type="button" class="secondary" data-edit-purchase="${safe(p.recordId)}">Edit / delete</button></div>`;
    }).join('') : '<p>No purchases recorded yet.</p>'}
  </section>`;
} else {
  html += renderHouseholdSettings();
  html += `<div class="card"><form id="settingsForm" class="row">
    <label>Monthly budget (£)<input id="budget" type="number" min="0" step=".01" value="${safe(settings.monthlyBudget)}" required></label>
    <label>Planning months<select id="months">${[6, 9, 12].map(n => `<option ${settings.months === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>Target days<select id="days">${[3, 7, 14, 28].map(n => `<option ${settings.days === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <button>Save settings</button>
  </form></div>`;
}
$('content').innerHTML=html;
bindCalendar();
bindProfile();
if(tab === 'prices')priceFinder.bind();
if(tab === 'wood')wood.bind();
if (tab === 'inventory') {
  const search = $('stockSearch');
  const category = $('stockCategory');
  const status = $('stockStatus');
  const results = $('stockResults');
  const updateStock = () => {
    const query = filters.search.trim().toLowerCase();
    const matching = catalogue.filter(item => {

async function applyEdit(remove){

  const e={...editing},quantity=remove?0:$('editQuantity').valueAsNumber,cost=remove?0:$('editCost').valueAsNumber;
  if(!Number.isSafeInteger(quantity)||quantity<(e.kind==='purchase'&&!remove?1:0)||quantity>1000000||
    (e.kind==='purchase'&&(!Number.isFinite(cost)||cost<0||cost>100000))){say('Check the quantity and cost.','error');return;}
  if(remove&&!confirm(e.kind==='stock'?'Remove all current stock for this item? Purchase history will remain.':'Delete this purchase and reverse its stock addition?'))return;
  const root=doc(db,'households',e.uid);
  busy=true;$('editSave').disabled=$('editDelete').disabled=$('editCancel').disabled=true;
  let committed=false;
  try {
    await runTransaction(db,async tx=>{
      if(e.kind==='stock'){
        const ref=doc(root,'inventory',String(e.id)),snap=await tx.get(ref),item=catalogue[e.id];
        if((snap.exists()?snap.data().quantity:0)!==e.quantity)throw Error('Stock changed elsewhere. Cancel and reload before editing.');
        if(remove||quantity===0)tx.delete(ref);
        else tx.set(ref,{name:item.name,category:item.category,quantity,updatedAt:serverTimestamp()},{merge:true});
        return;
      }
      const ref=doc(root,'purchases',e.id),snap=await tx.get(ref);
      if(!snap.exists())throw Error('This purchase no longer exists.');
      const p=snap.data();
      if(p.quantity!==e.quantity||p.cost!==e.cost)throw Error('Purchase changed elsewhere. Cancel and reload before editing.');
      const item=catalogue[p.itemId],stockRef=doc(root,'inventory',String(p.itemId));
      const delta=quantity-p.quantity;
      const stockSnap=delta?await tx.get(stockRef):null;
      const current=stockSnap?.exists()?stockSnap.data().quantity:0;
      if(delta&&current+delta<0)throw Error('Not enough current stock to reverse this purchase. Reconcile inventory first.');
      const match=e.id.match(/^month-(\d{4}-\d{2})-(\d+)$/);
      let receiptRef=null,receipt=null;
      if(match){
        receiptRef=doc(root,'completions',match[1]);const rs=await tx.get(receiptRef);
        if(!rs.exists())throw Error('The linked monthly receipt is missing.');
        receipt=rs.data();
        if(!receipt.lines[match[2]])throw Error('The linked monthly receipt does not contain this item.');
      }
      if(delta)tx.set(stockRef,{name:item.name,category:item.category,quantity:current+delta,updatedAt:serverTimestamp()},{merge:true});
      if(remove)tx.delete(ref);else tx.update(ref,{quantity,cost:Math.round(cost*100)/100});
      if(receipt){
        const lines={...receipt.lines};
        if(remove)delete lines[match[2]];else lines[match[2]]={quantity,cost:Math.round(cost*100)/100};
        tx.update(receiptRef,{lines,totalCost:Math.round(Object.values(lines).reduce((sum,line)=>sum+line.cost*100,0))/100});
      }
    });
    committed=true;closeEdit();await refresh();say(remove?'Record deleted':'Changes saved','success');
  }catch(err){say(committed?'Changes saved, but refresh failed. Reload the page.':err.code==='permission-denied'?'Permission denied. Publish the latest Firestore rules before editing purchases.':err.message,'error')}
  finally{busy=false;$('editSave').disabled=$('editDelete').disabled=$('editCancel').disabled=false;}
}

function monthKey(date = new Date()) {
  const parts = new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',timeZone:'Europe/London'}).formatToParts(date);
  return parts.find(p=>p.type==='year').value + '-' + parts.find(p=>p.type==='month').value;

function sixMonthsFrom(date) {
  const next = new Date(date);
  const day = next.getUTCDate();
  next.setUTCDate(1);
  next.setUTCMonth(next.getUTCMonth() + 6);
  const last = new Date(Date.UTC(next.getUTCFullYear(), next.getUTCMonth()+1, 0)).getUTCDate();
  next.setUTCDate(Math.min(day,last));
  return next;
}

async function createCalendar() {
  const uid = user.uid, root = doc(db,'households',uid);
  const plan = monthlyPlan(), start = monthKey();
  const [year,month] = start.split('-').map(Number);
  const refs = plan.map((_,i)=>doc(root,'plans',monthKey(new Date(Date.UTC(year,month-1+i,15)))));
  const profileRef = doc(root,'preferences','profile'), reviewRef = doc(root,'preferences','review');
  await runTransaction(db,async tx=>{
    const storedProfile = await tx.get(profileRef);
    const existing = await Promise.all(refs.map(ref=>tx.get(ref)));
    const existingReview = await tx.get(reviewRef);
    const currentStock = await Promise.all(catalogue.map(item=>tx.get(doc(root,'inventory',String(item.id)))));
    if(currentStock.some((snapshot,index)=>(snapshot.exists()?snapshot.data().quantity:0)!==owned(catalogue[index]))) throw Error('Inventory changed in another window. Reload before creating the plan.');
    if (existing.some(s=>s.exists())) throw Error('A calendar plan already exists. Reload to see it.');
    const currentProfile = {...defaultProfile,...(storedProfile.exists()?storedProfile.data():{})};
    if (JSON.stringify(Object.fromEntries(Object.keys(defaultProfile).map(k=>[k,currentProfile[k]]))) !==
        JSON.stringify(Object.fromEntries(Object.keys(defaultProfile).map(k=>[k,profile[k]])))) {
      throw Error('Household settings changed in another window. Reload before creating the plan.');
    }
    plan.forEach((month,i)=>tx.set(refs[i], {
      lines:month.lines.reduce((result,line)=>{const prev=result[line.id]||{quantity:0,cost:0};result[line.id]={quantity:prev.quantity+line.quantity,cost:Math.round((prev.cost+line.cost)*100)/100};return result},{}),
      budget:settings.monthlyBudget, carry:month.balance, householdSize:profile.size, createdAt:serverTimestamp()
    }));
    if (!existingReview.exists()) tx.set(reviewRef,{
      nextReview:Timestamp.fromDate(sixMonthsFrom(new Date())), updatedAt:serverTimestamp()
    });
  });
  await refresh();
}

async function completeCalendarMonth(key, lines) {
  const uid=user.uid, root=doc(db,'households',uid);
  const planRef=doc(root,'plans',key), completionRef=doc(root,'completions',key);
  await runTransaction(db,async tx=>{
    const planSnapshot=await tx.get(planRef);
    const done=await tx.get(completionRef);
    if (done.exists()) return;
    if (!planSnapshot.exists()) throw Error('This month has no saved plan.');
    const planned=planSnapshot.data().lines;
    for(const [id,line] of Object.entries(lines)) {
      if (!planned[id] || !Number.isSafeInteger(line.quantity) || line.quantity<1 || line.quantity>10000 ||
          !Number.isFinite(line.cost) || line.cost<0 || line.cost>100000) throw Error('Check the purchase quantities and costs.');
    }
    const entries=Object.entries(lines);
    const stocks=await Promise.all(entries.map(([id])=>tx.get(doc(root,'inventory',id))));
    entries.forEach(([id,line],index)=>{
      const item=catalogue[Number(id)], previous=stocks[index].exists()?stocks[index].data().quantity:0;
      tx.set(doc(root,'inventory',id),{name:item.name,category:item.category,quantity:previous+line.quantity,updatedAt:serverTimestamp()},{merge:true});
      if (line.cost>0) tx.set(doc(root,'purchases','month-'+key+'-'+id),{
        itemId:Number(id), name:item.name, quantity:line.quantity, cost:line.cost, purchasedAt:serverTimestamp()
      });
    });
    tx.set(completionRef,{lines,totalCost:Math.round(entries.reduce((sum,[,line])=>sum+line.cost*100,0))/100,completedAt:serverTimestamp()});
  });
  await refresh();
}

      <label>Children (including babies)<input id="householdChildren" type="number" min="0" max="20" value="${profile.children}" required></label>
      <label>Babies<input id="householdBabies" type="number" min="0" max="20" value="${profile.babies}" required></label>
      <label>Food preference<select id="householdDiet">${diets.map(d=>`<option ${profile.diet===d?'selected':''}>${d}</option>`).join('')}</select></label>
    </div>
    <label class="check-label"><input id="householdPets" type="checkbox" ${profile.pets?'checked':''}> Include pet supply checks</label>
    <label class="check-label"><input id="householdMedical" type="checkbox" ${profile.medical?'checked':''}> Include medicine and equipment checks</label>
    <label>Food substitutions, allergies or household shopping notes<textarea id="householdNotes" maxlength="1000" rows="3">${safe(profile.notes)}</textarea></label>
    <p class="muted">Household size scales water and food targets. Preferences and notes appear alongside the list for choosing suitable products. Saved calendar allocations stay fixed; check portions if household needs change.</p>
    <button>Save household</button>
  </form></section>`;
}
function bindProfile() {
  if(!$('profileForm'))return;
  $('profileForm').onsubmit=e=>{
    e.preventDefault();
    const p={size:$('householdSize').valueAsNumber,children:$('householdChildren').valueAsNumber,babies:$('householdBabies').valueAsNumber,
      pets:$('householdPets').checked,medical:$('householdMedical').checked,diet:$('householdDiet').value,notes:$('householdNotes').value.trim()};
    if(p.children>p.size || p.babies>p.children) {say('Children must fit within the household total, and babies within the number of children.','error');return;}
    runAction(e.target.querySelector('button'),async()=>{
      await setDoc(path('preferences','profile'),{...p,updatedAt:serverTimestamp()});await refresh();
    },'Household settings saved');
  };
}
function validatedEmail() {
  const field=$('email');
  field.value=field.value.trim();
  if(!field.value || !field.checkValidity()) {
    say('Enter a complete email address, such as name@example.com.','error');field.reportValidity();return null;
  }
  return field.value;
}
function authError(error) {
  const messages={
    'auth/invalid-email':'Check the email address. Use the full address, such as name@example.com.',
    'auth/email-already-in-use':'An account already uses this email. Sign in or reset your password.',
    'auth/weak-password':'Choose a password with at least six characters.',
    'auth/invalid-credential':'The email or password was not recognised. Try again or reset your password.',
    'auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again.',
    'auth/network-request-failed':'Unable to connect. Check your connection and try again.'
  };
  say(messages[error.code] || 'Unable to complete this request. Please try again.','error');
}
onAuthStateChanged(auth,async u=>{user=u;$('auth').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('logout').classList.toggle('hidden',!u);if(u){say('Loading your household plan…');try{await refresh();say('');await wood.load()}catch(err){say('Database access failed: '+err.message, 'error')}}else{closeRecord();closeEdit();wood.reset();profile={...defaultProfile};savedMonths=[];completions={};review=null;selectedMonth='';stock={};purchases=[];filters.search=filters.category=filters.status='';$('content').replaceChildren();say('')}});
</script></body></html>
