name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: resilience-firestore-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.22.1
      - name: Check deployment configuration
        env:
          PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo '::error::Configure FIREBASE_WIF_PROVIDER and FIREBASE_DEPLOY_SERVICE_ACCOUNT repository variables before deployment.'
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: newell-household-resilience
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publish Firestore security rules only
        run: firebase deploy --only firestore:rules --project newell-household-resilience --non-interactive
